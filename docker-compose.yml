services:
  db:
    image: mysql:8.4
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${DB_PASSWD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: db
      # ``-`` is equivalent to default value if null
      DB_LOGIN: ${DB_LOGIN:-root}
      DB_PASSWD: ${DB_PASSWD:-}
      DB_NAME: ${DB_NAME}
    command: ["node", "app.js", "--init=true"]
    # on db healty, basically
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    # build from local dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_LOGIN: ${DB_LOGIN:-root}
      DB_PASSWD: ${DB_PASSWD:-}
      DB_NAME: ${DB_NAME:-winget_serv}
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  db_data: